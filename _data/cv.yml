    Projects:
      - name: Segment Using Just One Example
        # summary: Quantum computing is the use of quantum-mechanical phenomena such as superposition and entanglement to perform computation. Computers that perform quantum computations are known as quantum computers.
        highlights:
          - Devised a novel unsupervised satellite image segmentation framework combining Segment Anything Model (SAM) with classical computer vision methods, addressing the critical challenge of scarce labelled satellite data.
          - Proposed methodology required only one labelled training image and achieved an IoU of 0.693 on the benchmark Potsdam dataset, outperforming a supervised U-Net baseline (IoU - 0.3214) by a significant margin.
        # start_date: 2024-01-01
        # end_date: 2024-06-30
      
      - name: Image Segmentation using Graph Machine Learning
        # summary: Quantum computing is the use of quantum-mechanical phenomena such as superposition and entanglement to perform computation. Computers that perform quantum computations are known as quantum computers.
        highlights:
          - Leveraged a pretrained Vision Transformer (ViT) to extract patch-wise feature vectors, modelling each patch as a graph node and applying a Graph Convolutional Network (GCN) to learn rich node embeddings for patch classification.
          - Implemented graph coarsening (graph compression) to enhance segmentation boundary accuracy while improving computational efficiency.
          - Achieved an IoU of 0.654, significantly outperforming the baseline (IoU - 0.382) trained without GCN and coarsening.

      - name: Traffic Estimation using Graph Neural Networks
        # summary: Quantum computing is the use of quantum-mechanical phenomena such as superposition and entanglement to perform computation. Computers that perform quantum computations are known as quantum computers.
        highlights:
          - Modelled city traffic data as a graph with intersections as nodes and roads as edges, training GCN and GAT models alongside temporal architectures (Graph LSTM) to predict intersection-level traffic from time-series data at neighbouring nodes.
          - Conducted comparative analysis of spatial and spatial-temporal graph neural networks, demonstrating the impact of neighbourhood interactions on intersection-level traffic prediction.

